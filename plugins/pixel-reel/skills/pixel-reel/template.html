:root {
  --page: #0b1220; --bar: #13203a; --track: #22344f; --cream: #ebeac5; --cream-lit: #f8f7dd;
  --muted: #9cafc7; --accent: #55d6be; --gold: #ffcc4d; --btn: #24476b; --btn-hi: #2f5d8a; --go: #2e7d32; --go-hi: #388e3c;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--cream-lit); font-family: Verdana, Tahoma, "Segoe UI", sans-serif; }
/* as wide as fits, but short enough that the controls stay on screen; main.js sets
   --caption-extra when a reel's longest caption needs more than the caption's min-height */
main { max-width: max(360px, min(980px, calc((100vh - 392px - var(--caption-extra, 0px)) * 16 / 9 + 32px))); margin: 0 auto; padding: 16px; }
h1 { font: 34px 'Orange Kid', monospace; margin: 2px 0 10px; color: var(--accent); letter-spacing: 1px; }
.stage { position: relative; background: #000; border: 4px solid var(--cream); border-radius: 4px 4px 0 0; overflow: hidden; }
canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; image-rendering: pixelated; cursor: pointer; }

/* the big Play button over the picture, before the reel starts and after it ends */
.bigplay { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 14px;
  font: 44px 'Orange Kid', monospace; letter-spacing: 1px; line-height: 1; padding: 12px 28px 14px 24px; background: var(--go);
  box-shadow: 0 6px 0 rgba(0, 0, 0, 0.5);
  /* as wide as its words: placed from the middle, it would otherwise be given half the picture and "Play again" would break in two on a phone */
  width: max-content; max-width: calc(100% - 16px); }
/* a title's words, and a plain card's, are in the middle of the picture: the button sits under them */
body[data-opens="title"] .bigplay, body[data-opens="card"] .bigplay { top: 72%; }
.bigplay svg { width: 28px; height: 32px; fill: currentColor; shape-rendering: crispEdges; }
.bigplay:hover { background: var(--go-hi); }
.bigplay[hidden] { display: none; }

/* the progress bar: click or drag to move through the reel; the ticks are scene starts */
.seek { position: relative; height: 16px; background: var(--track); border: solid var(--cream); border-width: 0 4px; cursor: pointer; touch-action: none; }
.seek[hidden] { display: none; }
.seek:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.seek-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--gold); }
.seek-fill::after { content: ''; position: absolute; top: 0; bottom: 0; right: -3px; width: 6px; background: var(--cream-lit); }
.seek .tick { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--page); opacity: 0.55; pointer-events: none; }

.caption { min-height: 150px; background: var(--bar); border: 4px solid var(--cream);
  border-radius: 0 0 4px 4px; padding: 12px 20px 14px; font-size: 23px; line-height: 1.55; letter-spacing: 0.3px; }
.caption .title { font: 34px 'Orange Kid', monospace; color: var(--gold); display: block; margin-bottom: 4px; }
/* the running time sits on the caption's heading line, at the right */
.caption .time { float: right; font: 26px 'Orange Kid', monospace; color: var(--muted); margin: 6px 0 0 16px; white-space: nowrap; }
.caption .rest { visibility: hidden; }
/* the typewriter's cursor takes no room, so lines never reflow as the words arrive */
.caption.typing #cap-typed::after { content: ''; display: inline-block; width: 0.42em; height: 0.95em; margin-right: -0.42em;
  vertical-align: -0.12em; background: var(--gold); }
.caption.error .body { white-space: pre-line; font-size: 18px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

.controls { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.controls[hidden] { display: none; }
button { font: bold 20px Verdana, sans-serif; color: var(--cream-lit); background: var(--btn); border: 3px solid var(--cream);
  border-radius: 4px; padding: 10px 15px; cursor: pointer; }
button:hover { background: var(--btn-hi); }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
button.big { background: var(--go); min-width: 116px; }
/* a button whose words change stacks them all and shows one, so it is always as wide as the longest */
button.labels { display: inline-grid; justify-items: center; }
button.labels > span { grid-area: 1 / 1; }
button.labels > span:not(.on) { visibility: hidden; }
button.big:hover { background: var(--go-hi); }
.dots { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.dot { width: 16px; height: 16px; padding: 0; background: #33506e; border: 2px solid var(--cream); border-radius: 0; }
.dots.many { gap: 4px; }
.dots.many .dot { width: 12px; height: 12px; }
.dot:hover { background: var(--btn-hi); }
.dot.on { background: var(--gold); }
.note { color: var(--muted); font-size: 15px; margin-top: 12px; line-height: 1.5; }
.note a { color: var(--accent); }

@media (max-width: 600px) {
  main { padding: 12px; }
  .caption { font-size: 18px; min-height: 130px; padding: 10px 14px 12px; }
  .caption .title { font-size: 26px; }
  .caption .time { font-size: 20px; margin-top: 4px; }
  button { font-size: 16px; padding: 8px 12px; }
  button.big { min-width: 96px; }
  .bigplay { font-size: 32px; padding: 8px 18px 10px 16px; gap: 10px; }
  .bigplay svg { width: 21px; height: 24px; }
  .dots { margin-left: 0; width: 100%; }
}

/* ?embed: just the player, to sit in an iframe on another page */
body.embed { background: var(--page); }
body.embed main { max-width: max(320px, min(100%, calc((100vh - 230px) * 16 / 9))); padding: 6px; }
body.embed h1, body.embed .note { display: none; }
body.embed .caption { min-height: 0; font-size: clamp(14px, 2.6vw, 20px); padding: 8px 14px 10px; }
body.embed .caption .title { font-size: clamp(20px, 3.6vw, 28px); margin-bottom: 2px; }
body.embed .controls { margin-top: 8px; gap: 8px; }
body.embed .controls > button { font-size: 15px; padding: 6px 12px; }
body.embed .controls > button.big { min-width: 88px; }
body.embed .bigplay { font-size: clamp(26px, 6vw, 44px); padding: 0.25em 0.6em 0.3em 0.55em; gap: 0.3em; }
body.embed .bigplay svg { width: 0.65em; height: 0.75em; }
body.embed .caption .time { font-size: clamp(16px, 3vw, 22px); margin-top: 2px; }
body.embed .dot { width: 12px; height: 12px; }
button:disabled { opacity: 0.6; cursor: progress; }

/* inside a chat (an MCP App): as wide as the chat, as tall as it needs, with a link to the reel's own page.
   The chat sizes the frame to fit, so the page never scrolls (a scrollbar would narrow the
   player, shortening it, and the two would chase each other) */
body.app { overflow: hidden; }
body.app main { max-width: none; }
body.app .note.open-page { display: block; margin: 10px 0 0; font-size: 15px; }
body.app .note.open-page a { display: inline-block; padding: 6px 12px; font-weight: bold; text-decoration: none; color: var(--cream-lit);
  background: var(--btn); border: 3px solid var(--cream); border-radius: 4px; }
body.app .note.open-page a:hover { background: var(--btn-hi); }
body.app .note.open-page a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
/* while the voice is recorded: a square for each line, lit as it is read */
.lines { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.lines[hidden] { display: none; }
.lines i { width: 16px; height: 16px; background: #33506e; border: 2px solid var(--cream); }
.lines i.on { background: var(--gold); }

__m['pictures.js'] = (() => {
// Ready-made pictures: a scene can say picture: { type: 'list', items: [...] } instead of
// writing draw(t, px). Each one animates in time with the scene. Data only, so a script or
// an AI agent can write a whole reel without a line of drawing code.
const { ICON_SIZE, ICONS } = __m['icons.js'];
const { PALETTE } = __m['palette.js'];

const INK = '#1a1a1a', NIGHT = '#0b1220', NAVY = '#13203a', CREAM = '#ebeac5', LIGHT = '#fdf6e3', GOLD = '#ffcc4d';
const TEAL = '#55d6be', BLUE = '#24476b', GREY = '#9fb3c8', PINK = '#ff7eb6', MUTED = '#6f87a3';

/** Shrinks `size` (in steps of 2) until `str` fits in `maxW`. */
function fit(px, str, size, maxW, min = 10) {
  while (size > min && px.textW(str, size) > maxW) size -= 2;
  return size;
}

/** A panel with its corners knocked off, the way pixel art rounds things. */
function roundBox(px, x, y, w, h, fill, edge = INK) {
  px.rect(edge, x + 1, y, w - 2, h);
  px.rect(edge, x, y + 1, w, h - 2);
  px.rect(fill, x + 1, y + 1, w - 2, h - 2);
}

/** The three coloured dots on a window's title bar. */
function dots(px, x, y) {
  ['#d63a3a', GOLD, '#3fa34d'].forEach((c, i) => px.rect(c, x + i * 6, y, 4, 4));
}

/** A window with a title bar; returns the inside: { x, y, w, h }. */
function frame(px, x, y, w, h, title, body) {
  px.window(x, y, w, h, body);
  px.rect(BLUE, x + 1, y + 1, w - 2, 12);
  dots(px, x + 5, y + 5);
  if (title) px.text(title, x + w / 2, y + 1, 12, CREAM, 'center');
  return { x: x + 1, y: y + 13, w: w - 2, h: h - 14 };
}

/** Wrapped text, centred on cx, typed out line by line from `start`. */
function typedBlock(px, str, cx, y, t, start, size, col, maxW, cps = 28) {
  let budget = Math.floor((t - start) * cps);
  px.wrap(str, maxW, size).forEach((line, i) => {
    const shown = line.slice(0, Math.max(0, budget));
    budget -= line.length;
    if (shown) px.text(shown, Math.round(cx - px.textW(line, size) / 2), y + i * (size + 3), size, col);
  });
}

const memos = new WeakMap();

/** Works something out once per picture (layouts need the font, so they wait for the first frame). */
function memo(p, key, fn) {
  if (!memos.has(p)) memos.set(p, {});
  const m = memos.get(p);
  if (!(key in m)) m[key] = fn();
  return m[key];
}

/** The biggest of `sizes` at which every line fits `maxW` and `rowsFor(size)` rows fit. */
function fitLines(px, lines, sizes, maxW, rowsFor, rowsNeeded) {
  return sizes.find((s) => rowsFor(s) >= rowsNeeded && lines.every((l) => px.textW(l, s) <= maxW)) ?? sizes.at(-1);
}

function title(t, px, p) {
  const { W } = px;
  px.sky(NIGHT, '#2f5d8a');
  px.stars(t);
  px.moon(278, 28);
  px.hills('#1f3b5e', 152, 26, t * 3, 2);
  px.hills('#142a45', 170, 14, t * 8, 5);
  const size = fit(px, p.text, 36, W - 36);
  const y = Math.round(px.tween(t, 0.15, 1, -50, p.sub ? 44 : 64, 'bounce'));
  px.text(p.text, W / 2, y + 2, size, INK, 'center');
  px.text(p.text, W / 2, y, size, GOLD, 'center', '#7a4a24');
  if (p.sub) typedBlock(px, p.sub, W / 2, y + size + 8, t, 1.3, 14, LIGHT, W - 60);
}

const TICK = ['.........g', '........gg', 'g......gg.', 'gg....gg..', '.gg..gg...', '..gggg....', '...gg.....'];

/** A navy backdrop with a faint grid of dots, for pictures that set things out on it. */
function dotted(px) {
  const { W, H } = px;
  px.rect(NAVY, 0, 0, W, H);
  for (let y = 4; y < H; y += 8) for (let x = 4; x < W; x += 8) px.rect('#1a2b47', x, y, 1, 1);
}

function list(t, px, p) {
  const { W, H } = px;
  dotted(px);
  const top = p.heading ? 36 : 10, room = H - top - 8;
  if (p.heading) px.sign(p.heading, W / 2, 9, fit(px, p.heading, 16, W - 40), GOLD);
  const n = p.items.length, rowH = Math.min(30, Math.floor(room / n));
  const size = Math.max(10, Math.min(20, rowH - 8) & ~1);
  const first = top + Math.floor((room - rowH * n) / 2);   // the list sits in the middle of the space left
  const every = p.every ?? 1.4, start = p.start ?? 0.6;
  const latest = Math.floor((t - start) / every);
  p.items.forEach((item, i) => {
    const at = start + i * every;
    if (t < at) return;
    const x = 26 + Math.round(px.tween(t, at, 0.35, -70, 0, 'out'));
    const y = first + i * rowH + Math.floor((rowH - 13) / 2);
    if (p.numbered) {
      px.circle(GOLD, x + 6, y + 6, 7);
      px.text(String(i + 1), x + 6, y, 12, INK, 'center');
    } else {
      px.window(x, y, 13, 13, LIGHT);
      if (t >= at + 0.3) px.sprite(TICK, x + 2, y + 3);
    }
    const s = fit(px, item, size, W - x - 30);
    px.text(item, x + 20, y + 7 - Math.round(s * 0.55), s, i === latest && t < at + every + 1 ? GOLD : CREAM, 'left', INK);
  });
}

const CMD_CPS = 16;

function showError(message) {

  // is still being recorded (the player in a chat) leaves them in window.pixelreelClips,
  // { clips: [{ text, file, seconds }], more, guesses }, and says so with a "pixelreel:clips"
  // event. `more` is true while others are still on their way, and `guesses` ([{ text,
  // seconds }]) say about how long those will last, for the reel's clock until they come.

  let coming = false;   // true while recordings are still on their way
  const clipNow = (scene) => late.get(scene.say) ?? clipFor(scene);

  [words.soundOn, words.soundOff].forEach((label, i) => { muteBtn.children[i].textContent = label; });

  scenes.forEach((s, i) => {

    cap.classList.remove('typing');
