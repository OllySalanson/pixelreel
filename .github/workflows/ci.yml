name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Install ffmpeg, for the narration tests
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
      - run: npm test
      - name: Check every reel is valid and fully recorded
        run: npm run check -- --recorded
      - name: Check the Python narration helper compiles
        run: python3 -m py_compile scripts/kokoro_tts.py
