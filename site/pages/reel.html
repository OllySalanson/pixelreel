<!--
title: A pixel reel - Pixel Reel
description: A pixel reel: a short cartoon with a warm voice. Press Play, and Peter will read it to you.
image: reel-card.png
imagealt: A pixel reel for you. Press Play. Reelie the film reel stands under a night sky.
-->

<section class="watch night" aria-labelledby="watch-title">
  <canvas class="scene" data-scene="cinema" aria-hidden="true"></canvas>
  <div class="wrap watch-in" id="watch" data-watch="{{reelid}}">
    <!-- the player says the reel's name, large, under its picture: said twice it only pushed the reel down the screen -->
    <h1 class="sr-only" id="watch-title">{{reeltitle}}</h1>
    {{player:empty}}
    <div class="reel-end" hidden>
      <p>The end.</p>
      <button class="btn btn-gold" type="button" data-send="{{reeltitle}}" data-says="#watch-sent">Send it to someone</button>
      <button class="btn btn-paper" type="button" data-again>Watch it again</button>
    </div>
    <p class="sr-only" id="watch-says" role="status"></p>
    <div class="watch-foot" data-quiet>
      <div class="row">
        <button class="btn btn-gold" type="button" data-send="{{reeltitle}}" data-says="#watch-sent" hidden>Send it to someone</button>
        <a class="btn btn-paper" id="watch-video" href="/r/{{reelid}}/video.mp4" download hidden>Save the video</a>
        <p class="watch-sent" id="watch-sent" role="status"></p>
      </div>
      <p id="watch-kept" hidden>Only people with this link can watch. It is kept until <span id="watch-until"></span>.</p>
    </div>
  </div>
</section>

<section class="section" aria-labelledby="own-title">
  <div class="wrap">
    <div class="head">
      <p class="eyebrow">Made with Pixel Reel</p>
      <h2 id="own-title">Want one of your own?</h2>
      <p class="lead">Pixel Reel turns anything wordy into a short cartoon like this one. It is free.</p>
      <div class="row">
        <a class="btn btn-gold btn-big" href="/claude">Add Pixel Reel to Claude</a>
        <a class="btn btn-paper btn-big" href="/">See what it is</a>
      </div>
    </div>
  </div>
</section>
