<!--
title: Make a pixel reel - Pixel Reel
description: Type, say or paste anything: a link, a meeting's transcript, a question. Pixel Reel turns it into a short cartoon, read aloud.
-->

<!-- Making a reel: a reel about how to make one, with My notes beside it, as on every reel's page.
     Whatever goes in My notes is what the visitor's own reel is made from. -->
<section class="watch night make-watch" aria-labelledby="make-title" data-here="{{here}}">
  <canvas class="scene" data-scene="cinema" aria-hidden="true"></canvas>
  <div class="wrap watch-in" id="making" data-mic="{{mic}}">
    <h1 class="sr-only" id="make-title">Make a pixel reel</h1>
    <div class="watch-pair">
      {{player:site-how-to-make}}
      <!-- when it ends: things to try, each made into a reel with one press (notes.js), where the service makes reels itself -->
      <div class="reel-end" hidden>
        <p>Try one</p>
        <div class="suggest" id="suggest">
          <button class="btn btn-gold btn-small" type="button" data-suggest="Why do cats knead blankets?">Why do cats knead blankets?</button>
          <button class="btn btn-gold btn-small" type="button" data-suggest="How does a plane stay up?">How does a plane stay up?</button>
          <button class="btn btn-gold btn-small" type="button" data-suggest="Why is yawning catching?">Why is yawning catching?</button>
          <button class="btn btn-gold btn-small" type="button" data-suggest="How do bees make honey?">How do bees make honey?</button>
        </div>
        <button class="btn btn-paper" type="button" data-again>Watch it again</button>
      </div>
      <!-- My notes, for a first reel: anything typed, said or pasted (a link, a transcript, questions), kept on
           this device. notes.js wakes it where the service can write a reel itself -->
      {{mynotes:first}}
    </div>
    <!-- where the service cannot write a reel itself, the way to make one is through Claude -->
    <p class="make-elsewhere" id="make-elsewhere" hidden><a class="btn btn-gold btn-big" href="/claude">Add Pixel Reel to Claude</a></p>
  </div>
</section>
