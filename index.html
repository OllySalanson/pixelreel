<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixelreel</title>
<meta name="description" content="Narrated pixel-art explainer videos, made from a short list of scenes.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 8%22%3E%3Crect width=%228%22 height=%228%22 fill=%22%2355d6be%22/%3E%3Crect x=%222%22 y=%222%22 width=%224%22 height=%224%22 fill=%22%230b1220%22/%3E%3C/svg%3E">
<link rel="preload" href="fonts/orange-kid.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/pixelreel.css">
<script type="module" src="src/main.js"></script>
</head>
<!-- data-reel is the reel shown when the address has no ?reel=name -->
<body data-reel="what-is-pixelreel">
<main>
  <h1 id="heading">pixelreel</h1>
  <div class="stage">
    <canvas id="stage" width="960" height="540" role="img" aria-label="Scene pictures"></canvas>
    <button id="bigplay" class="bigplay" type="button" hidden>
      <svg viewBox="0 0 7 8" aria-hidden="true"><path d="M0 0h2v1h2v1h2v1h1v2h-1v1h-2v1h-2v1h-2z"/></svg><span id="bigplay-label">Play</span>
    </button>
  </div>
  <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Position in the reel" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
    <div class="seek-fill" id="seek-fill"></div>
  </div>
  <div class="caption" id="cap">
    <span class="title" id="cap-title">Loading</span>
    <span class="body" id="cap-body" aria-hidden="true"><span id="cap-typed"></span><span class="rest" id="cap-rest"></span></span>
  </div>
  <p class="sr-only" id="cap-live" aria-live="polite"></p>
  <div class="controls">
    <button id="back" type="button">Back</button>
    <button id="play" type="button" class="big">Play</button>
    <button id="next" type="button">Next</button>
    <button id="mute" type="button" aria-pressed="true">Sound: on</button>
    <span class="time" id="time" aria-hidden="true">0:00 / 0:00</span>
    <div class="dots" id="dots" aria-label="Scenes"></div>
  </div>
  <p class="note" id="note"></p>
  <noscript><p class="note">pixelreel needs JavaScript to play.</p></noscript>
</main>
</body>
</html>
